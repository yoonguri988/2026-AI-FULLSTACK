spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XE
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update  #  test환경  create-drop 매번초기화 / update 부분수정  
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB      

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  config:
    import: 
      - optional:application-oauth.yml
      - optional:file:.env[.properties]

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.thejoa703.domain 

jwt:
  issuer: thejoa703
  secret: ${JWT_SECRET}
  access-token-exp-seconds: 900       
  refresh-token-exp-seconds: 1209600   
  header: Authorization
  prefix: Bearer

file:
  #upload-dir: /home/ubuntu/app/back/build/libs/uploads
  upload-dir: uploads

#server:
#  port: 8484

# https://thejoa703v2.duckdns.org
# 프록시서버(nginx) , 프로시가 전달해준 https 헤더정보 어떻게 처리할것인지
server:
  forward-headers-strategy: native