<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>얼굴 줄 세우기 (ul 버전)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body{  
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-image:linear-gradient(135deg, #f4ffb8 , #8affd0);
        }
        h1{ 
            border-left:10px solid #123456; 
            border-bottom:1px solid #123456;
            margin:30px 0;
        }
        .container{  
            width:50%; 
            margin:50px auto;   
            border-radius: 10px;
            background-color:#fff;  
            padding:20px;  
            box-shadow:0 0 10px rgba(0,0,0,0.2);

            overflow: hidden;
        }
        /* .t1 왼쪽에 배치, .t2는 왼쪽에 배치 - 하얀색 배경 나오게 (.container { overflow: hidden; })*/
        .t1 {
            float: left;
        }
        .t2 {
            float: right;
        }
        /* 여러 개의 얼굴 이미지를 원형으로 꾸미고, */
        /* Q1. ul 태그의 기본 목록 스타일 제거, 안쪽/바깥 여백 없애기 */
        ul{
            list-style: none;
            overflow: hidden; /* clear: both */
            /* hidden : 넘치는 값을 숨겨줌 */
            width: 40%;
            background-color: #333;
        }
        /* Q2. li 태그는 왼쪽으로 나란히 배치(float:left), 바깥 여백(10px) */
        ul.team li {
            float: left;
            margin: 10px;
        }
        /* Q3. img 너비/높이(100px), 원형(border-radius:50%), 테두리(3px solid #ff6600), */
          /* 전환 효과(transform, border-color 각각 0.8s) */
        ul.team img {
            width: 100px;
            height: 100px;
            border: 3px solid #ff6600;
            border-radius: 50%;
            transition: transform 0.8s, border-color 0.8s;
        }
        /* Q4. 첫 번째 얼굴: 마우스 오버 시 위로 점프(translateY(-20px)), 테두리 색(#00ccff) */
        ul.team li:first-child img:hover {
            transform: translateY(-20px);
            border-color: #00ccff;
        }
        /* Q5. 두 번째 얼굴: 마우스 오버 시 좌우 흔들기(rotateZ(20deg)), 테두리 색(#33cc33) */
        ul.team li:nth-child(2) img:hover {
            transform: rotateZ(20deg);
            border-color: #33cc33;
        }
        /* Q6. 세 번째 얼굴: 마우스 오버 시 X축 뒤집기(rotateX(180deg)), 테두리 색(#ff33aa) */
        li:nth-child(3):hover img {
            transform: rotateX(180deg);
            border-color: #ff33aa;
        }
        /* Q7. 네 번째 얼굴: 마우스 오버 시 Y축 뒤집기(rotateY(180deg)), 테두리 색(#ffaa00) */
        li:nth-child(4):hover img {
            transform: rotateY(180deg);
            border-color: #20ca8c;
        }
        /* Q8. 마지막 얼굴: 마우스 오버 시 빙글빙글 회전(rotate(360deg) scale(1.2)), 테두리 색(#6600ff) */
        li:last-child img:hover {
            transform: rotate(360deg) scale(1.2);
            border-color: #6600ff;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>어벤져스</h1>
        <ul class="team t1">
            <li><img src="./img/one.png" alt="one 회원"/></li>
            <li><img src="./img/two.png" alt="two 회원"/></li>
            <li><img src="./img/three.png" alt="three 회원"/></li>
            <li><img src="./img/four.png" alt="four 회원"/></li>
            <li><img src="./img/five.png" alt="five 회원"/></li>
        </ul>

        <ul class="team t2">
            <li><img src="https://picsum.photos/100?random=1" alt="얼굴1"></li>
            <li><img src="https://picsum.photos/100?random=2" alt="얼굴2"></li>
            <li><img src="https://picsum.photos/100?random=3" alt="얼굴3"></li>
            <li><img src="https://picsum.photos/100?random=4" alt="얼굴4"></li>
            <li><img src="https://picsum.photos/100?random=5" alt="얼굴5"></li>
        </ul>
    </div>
</body>
</html>
