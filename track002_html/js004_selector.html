<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>NodeList vs HTMLCollection</title>
  <style>
    .highlight {
      background-color: yellow;
      font-weight: bold;
    }
    .added {
      color: red;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h2>과일 목록</h2>
  <ul id="fruits">
    <li class="fruit">Apple</li>
    <li class="fruit">Banana</li>
    <li class="fruit">Cherry</li>
  </ul>

  <button id="addFruit">과일 추가하기</button>
  <button id="highlight">첫 번째 과일 강조하기</button>

  <script>
    window.addEventListener("load", function(){
      // HTMLCollection (실시간) getElementById, getElementsByTagName
      const fhtml = document.getElementsByClassName("fruit");
      // NodeList (정적) 
      const fnode = document.querySelectorAll(".fruit");
      
      // 버튼 이벤트
      document.getElementById("addFruit").onclick = function() {
        const newli = document.createElement("li"); // createElement 태그 만들기
        newli.textContent = "Peach"; // 태그 안의 콘텐츠 - text
        newli.classList.add("fruit", "added"); // 2. css 추가
        document.getElementById("fruits").appendChild(newli); // 1. Peach 추가

        console.log(fhtml, fhtml.length);
        console.log(fnode, fnode.length);
      }

      document.querySelector("#highlight").onclick = function(){
        let list = document.querySelectorAll("#fruits li");
        list.classList.add("highlight");
      };
      
    });
  </script>
</body>
</html>
