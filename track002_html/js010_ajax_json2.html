<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart - Button Animation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* 버튼 클릭 애니메이션 */
    .btn-animate {
      transition: transform 0.2s ease, background-color 0.3s ease;
    }
    .btn-animate:active {
      transform: scale(0.95) rotate(-2deg);
      background-color: #0d6efd;
      color: #fff;
    }

    /* 카드 hover 효과 */
    .card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    .card img {
      transition: transform 0.3s ease;
    }
    .card:hover img {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
<div class="container my-4">
  <h3 class="mb-3">🛒 Shopping Cart</h3>
  <button class="btn btn-outline-primary btn-animate mb-3" onclick="loadCart()">장바구니 불러오기</button>
  <div class="row" id="cartContainer"></div>
  <div class="alert alert-info mt-3" id="totalPrice">총합계: 0원</div>
</div>

<script> 
  function loadCart(){
    fetch("./data/cart.json")
      .then(res=>{
        if(!res.ok) throw Error("에러코드: "+res.status);
        return res.json();
      })
      .then(data=>{
        document.getElementById("cartContainer").innerHTML = "";
        let totalPrice = 0;
        for(let prod of data){
          let result = `<div class="card col-sm-3 mx-3 my-5 p-0">
                        <div><img class="w-100 h-100 object-fit-cover" src="${prod.img}" alt=${prod.product}/></div>
                        <h5 class="mt-3 px-3">${prod.product}</h5>
                        <div class="mb-3 px-3">가격: ${prod.price.toLocaleString()}원</div>
                        <div class="mb-3 px-3">수량: ${prod.qty}개</div>
                        <div class="mb-3 px-3"><strong>합계: ${(prod.price * prod.qty).toLocaleString()}원</strong></div>
                        </div>`;
          totalPrice += prod.price * prod.qty;
          document.getElementById("cartContainer").innerHTML += result;
        }
        document.getElementById("totalPrice").innerHTML = `총 합계: ${totalPrice.toLocaleString()}원`;
      }).catch(err=>{document.getElementById("cartContainer").innerHTML = err.message;});
  }
</script>
</body>
</html>
