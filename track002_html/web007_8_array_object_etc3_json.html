<!DOCTYPE html>
<html lang="ko">
<head>
  <title>Avengers Members - Ajax Fetch</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container my-3">
  <h3 class="card-header">Avengers Members</h3>
  <input type="text" id="searchBox" placeholder="이름 검색..." class="form-control my-2" onkeyup="filterTable()"/>
  <table class="table table-striped table-bordered" id="memberTable">
    <thead>
      <tr><th>Image</th><th>Name</th><th>Age</th><th>Address</th><th>Mobile</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- 모달 -->
<div class="modal fade" id="infoModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Member Info</h5></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button></div>
    </div>
  </div>
</div>

<script>
// 데이터 불러오기 
 window.addEventListener("load", function() {
   fetch("./data/member.json")
     .then(res=>{
       if(!res.ok) throw Error("에러상태: "+res.status);
       return res.json();
     })
     .then(data => {
       for(let member of data){
         document.querySelector("#memberTable tbody").innerHTML 
                += `<tr id="memberTr" onclick="memberModal(this)" data-bs-toggle="modal" data-bs-target="#infoModal">
                    <td><img src="${member.img}" alt="${member.name}" class="w-75" /></td>
                    <td>${member.name}</td>
                    <td>${member.age}</td>
                    <td>${member.address}</td>
                    <td>${member.moblie}</td>
                    </tr>`
       }
     })
     .catch(err=>{document.querySelector("#memberTable tbody").innerHTML=`<tr><td colspan="5">${err.message}</td></tr>`});

    });
    
// 모달 팝업 data-bs-toggle="modal" data-bs-target="#myModal"
function memberModal(data) {
  const body = document.getElementById("modalBody");
  body.innerHTML = "";

  const memberInfo = data.getElementsByTagName("td");
  body.innerHTML += `<div class="w-50">${memberInfo[0].getElementsByTagName("img")[0].outerHTML}</div>`;
  body.innerHTML += `<div class="">이름 : ${memberInfo[1].textContent}</div>`;
  body.innerHTML += `<div class="my-3">나이 : ${memberInfo[2].textContent}</div>`;
  body.innerHTML += `<div class="my-3">주소 : ${memberInfo[3].textContent}</div>`;
  body.innerHTML += `<div class="my-3">전화 : ${memberInfo[4].textContent}</div>`;
}
 
// 검색 필터 
function filterTable() {
  document.querySelector("#memberTable tbody").innerHTML = "";
  let search = document.getElementById("searchBox").value;
  
  fetch("./data/member.json")
     .then(res=>{
       if(!res.ok) throw Error("에러상태: "+res.status);
       return res.json();
     })
     .then(data => {
      data = data.filter((v) => v.name.toUpperCase().includes(search.toUpperCase()));
       for(let member of data){
        document.querySelector("#memberTable tbody").innerHTML 
                += `<tr id="memberTr" onclick="memberModal(this)" data-bs-toggle="modal" data-bs-target="#infoModal">
                    <td><img src="${member.img}" alt="${member.name}" class="w-75" /></td>
                    <td>${member.name}</td>
                    <td>${member.age}</td>
                    <td>${member.address}</td>
                    <td>${member.moblie}</td>
                    </tr>`
       }
     })
     .catch(err=>{document.querySelector("#memberTable tbody").innerHTML=`<tr><td colspan="5">${err.message}</td></tr>`});

}
</script>
</body>
</html>
